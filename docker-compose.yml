# Autonomous Content Engine Web - Local & Staging Stack
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ace_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ace_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-autonomous_content_engine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ace_user} -d ${POSTGRES_DB:-autonomous_content_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ace_redis
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: ace_temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ace_user}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-ace_secret_password}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.26
    container_name: ace_temporal_ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  localstack:
    image: localstack/localstack:3.4
    container_name: ace_localstack_s3
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ace_backend_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ace_user}:${POSTGRES_PASSWORD:-ace_secret_password}@postgres:5432/${POSTGRES_DB:-autonomous_content_engine}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-ace-media-vault}
      SKILL_BASE_DIR: /app/claude-content-engine-skill
    ports:
      - "8000:8000"
    volumes:
      - ./claude-content-engine-skill:/app/claude-content-engine-skill
      - media_workspace:/app/media_workspace

  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ace_temporal_worker
    command: python -m app.workflows.worker
    depends_on:
      backend:
        condition: service_started
      temporal:
        condition: service_started
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ace_user}:${POSTGRES_PASSWORD:-ace_secret_password}@postgres:5432/${POSTGRES_DB:-autonomous_content_engine}
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-ace-media-vault}
      SKILL_BASE_DIR: /app/claude-content-engine-skill
    volumes:
      - ./claude-content-engine-skill:/app/claude-content-engine-skill
      - media_workspace:/app/media_workspace

  media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    container_name: ace_media_gpu_worker
    profiles:
      - gpu
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q media_gpu
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ace_user}:${POSTGRES_PASSWORD:-ace_secret_password}@postgres:5432/${POSTGRES_DB:-autonomous_content_engine}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-ace-media-vault}
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cuda
    volumes:
      - media_workspace:/app/media_workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ace_frontend_web
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/events
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  media_workspace:
