<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#F5F6FA}
.slide{width:1080px;height:1350px;padding:104px 96px 112px;display:flex;flex-direction:column;color:#141627;
  font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.label{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;color:#4A4D63;letter-spacing:.01em}
.logo{width:60px;height:48px;display:block;flex:none}
.main{flex:1;display:flex;flex-direction:column;justify-content:center}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:100px;line-height:1.02;letter-spacing:-.025em;margin-bottom:56px}
.cover h1{font-size:120px;line-height:.98}
.withprompt h1{font-size:88px;margin-bottom:48px}
p.body{font-size:46px;line-height:1.32;max-width:870px}
.cover p.body{font-size:52px}
.withprompt p.body{font-size:40px;color:#2B2E45}
.act{color:#4F46E5}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.02em}
.prompt{background:#EEF0FF;border-radius:24px;padding:44px 48px;margin-bottom:48px;
  font-family:'IBM Plex Mono',monospace;font-size:35px;line-height:1.45;color:#141627}
.prompt .act{font-weight:600}
.caret{display:inline-block;width:18px;height:40px;background:#141627;vertical-align:-7px;margin-left:8px}
.foot{font-size:32px;line-height:1.35;color:#4A4D63;margin-top:48px}
.route{display:flex;flex-direction:column;align-items:flex-start;gap:26px;margin-bottom:72px}
.step{display:flex;align-items:center;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:64px;letter-spacing:-.015em}
.step:nth-child(2){margin-left:70px}.step:nth-child(3){margin-left:140px}
.arrow{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:56px;color:#141627;margin-right:24px}
.btn{background:#FFFFFF;border:3px solid #141627;border-radius:999px;padding:14px 46px 20px;line-height:1}
.btn.last{background:#141627;color:#F5F6FA}
</style></head><body><div class="slide  withprompt">
<div class="top"><div class="label">1 · Gmail</div><img class="logo" src="file:///C:/repos/kigaldevWeb/public/brand/kigaldev-monogram.svg" alt="KG"></div>
<div class="main"><h1>Lo que sigue sin contestar</h1><div class="prompt">Resúmeme los correos de clientes de esta semana que siguen <span class="act">sin respuesta</span>.</div><p class="body">Claude busca, lee y resume tu correo.</p></div>
</div></body></html>
