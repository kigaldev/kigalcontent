apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: autonomous-content-engine-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/ace-backend:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ace-database-url
                  key: latest
            - name: HITL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: ace-hitl-hmac-secret
                  key: latest
